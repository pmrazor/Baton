# Type-checks and tests the app on every platform it ships for. Runs on pushes
# and pull requests, and as the first step of a release (release.yml).

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      # The Rust build embeds the built frontend, so build it first.
      - name: Build frontend
        run: npm run build

      - name: Backend tests
        working-directory: src-tauri
        run: cargo test --locked
