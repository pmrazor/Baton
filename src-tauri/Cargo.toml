[package]
name = "baton"
version = "0.1.9"
description = "Baton: one workspace for many coding agents over ACP"
edition = "2021"

[lib]
name = "baton_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt", "net"] }
tauri-plugin-opener = "2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
getrandom = "0.4.3"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
base64 = "0.22"
portable-pty = "=0.9.0"
