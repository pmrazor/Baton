[package]
name = "baton"
version = "0.2.8"
description = "Baton: one workspace for many coding agents over ACP"
edition = "2021"

[lib]
name = "baton_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt", "net"] }
tauri-plugin-opener = "2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
getrandom = "0.4.3"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-notification = "=2.8.1"
base64 = "0.22"
portable-pty = "=0.9.0"
trash = "=5.2.5"
ignore = "=0.4.34"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
sha2 = "=0.10.9"
toml = { version = "=1.2.2", default-features = false, features = ["parse", "std"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
